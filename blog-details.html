<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Details - Peak Living</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="header-logo"><a href="index.html"><img src="images/logo5.png" alt="Peak Living Logo"></a></div>
  <nav id="main-nav"><ul>
    <li><a href="index.html">Home</a></li><li><a href="workshop.html">Workshops</a></li>
    <li><a href="blog.html" class="active">Blog</a></li><li><a href="podcast.html">Podcast</a></li>
    <li><a href="music.html">Music</a></li><li><a href="store.html">Store</a></li>
    <li><a href="gauri.html">About</a></li><li><a href="consulting.html" class="nav-cta">Book Consultation</a></li>
  </ul></nav>
  <div class="hamburger" onclick="document.getElementById('main-nav').classList.toggle('open')"><span></span><span></span><span></span></div>
</header>

<main style="background: var(--ivory); padding: 3rem 1.5rem; min-height: 60vh;">
  <div id="blog-content" class="blog-details-container" style="background: var(--white); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 3rem;">
    <p style="color: var(--muted);">Loading article...</p>
  </div>
  <div style="text-align:center; margin-top: 2rem;">
    <a href="blog.html" class="btn btn-outline">← Back to Blog</a>
  </div>
</main>

<footer>
  <div class="footer-container">
    <div>
      <div class="footer-logo"><img src="images/logo5.png" alt="Peak Living"></div>
      <p class="footer-desc">Integrating modern medical science with ancient wisdom.</p>
      <div class="footer-social"><div class="social-icons">
        <a href="https://www.facebook.com/DrGauriDeeperLife" target="_blank"><img loading="lazy" src="images/facebook.png" alt="FB"></a>
        <a href="https://www.instagram.com/drgauri.peakliving" target="_blank"><img loading="lazy" src="images/instagram.png" alt="IG"></a>
        <a href="https://www.linkedin.com/in/dr-gauri-mittal-a-00266615a" target="_blank"><img loading="lazy" src="images/linkedin.png" alt="LI"></a>
      </div></div>
    </div>
    <div class="footer-links"><h3>Quick Links</h3><ul>
      <li><a href="index.html">Home</a></li><li><a href="blog.html">Blog</a></li>
      <li><a href="workshop.html">Workshops</a></li><li><a href="consulting.html">Contact</a></li>
    </ul></div>
  </div>
  <p class="footer-text">&copy; 2025 Peak Living. All rights reserved.</p>
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
  import ENV from "./config.js";

  const firebaseConfig = {
    apiKey: ENV.FIREBASE_API_KEY,
    authDomain: ENV.FIREBASE_AUTH_DOMAIN,
    projectId: ENV.FIREBASE_PROJECT_ID,
    storageBucket: ENV.FIREBASE_STORAGE_BUCKET,
    messagingSenderId: ENV.FIREBASE_MESSAGING_SENDER_ID,
    appId: ENV.FIREBASE_APP_ID,
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const blogId = urlParams.get("id");
  const blogContent = document.getElementById("blog-content");

  if (blogId) {
    getDoc(doc(db, "blogs", blogId))
      .then((docSnap) => {
        if (docSnap.exists()) {
          const blog = docSnap.data();
          const dateStr = blog.timestamp?.seconds
            ? new Date(blog.timestamp.seconds * 1000).toLocaleDateString('en-IN', { year:'numeric', month:'long', day:'numeric' })
            : "Unknown date";
          blogContent.innerHTML = `
            <p style="font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--gold); margin-bottom:0.5rem;">Peak Living · ${dateStr}</p>
            <h1 style="font-family:'Cormorant Garamond',serif; font-size:clamp(1.8rem,4vw,3rem); color:var(--forest); margin-bottom:1.5rem;">${blog.title || "Untitled Blog"}</h1>
            ${blog.image ? `<img loading="lazy" src="${blog.image}" alt="${blog.title || 'Blog Image'}" style="width:100%; border-radius:var(--radius); margin-bottom:2rem;">` : ""}
            <div style="font-size:1.05rem; line-height:1.9; color:#444;">${blog.content || "No content available."}</div>
          `;
        } else {
          blogContent.innerHTML = "<p>⚠️ Blog article not found.</p>";
        }
      })
      .catch((error) => {
        console.error("Error fetching blog:", error);
        blogContent.innerHTML = "<p>⚠️ Unable to load article. Please try again.</p>";
      });
  } else {
    blogContent.innerHTML = "<p>⚠️ No article ID specified.</p>";
  }
</script>
</body>
</html>
